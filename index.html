<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Neon City v4.3 - Final</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #joystick-zone {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px; z-index: 100;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="joystick-zone"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script>
        // --- 1. SETUP ENGINE ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 10, 500); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 3.0, 10); // Tầm mắt cao 3m

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x442266, 2); 
        scene.add(ambientLight);
        const sunLight = new THREE.PointLight(0xffffff, 3, 500);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // --- 2. PHONG CẢNH (DÙNG LINK TRỰC TIẾP CỦA BẠN) ---
        const loader = new THREE.TextureLoader();
        
        // Lệnh cực kỳ quan trọng để GitHub cho phép Three.js lấy ảnh
        loader.setCrossOrigin('anonymous'); 

        // Link trực tiếp bạn đã kiểm tra thành công
        const imageURL = 'https://liyokun.github.io/Room0/neoncity0.webp'; 

        loader.load(
            imageURL, 
            function(texture) {
                console.log("Thành phố Neo Tokyo đã lên đèn!");
                const sky = new THREE.Mesh(
                    new THREE.SphereGeometry(800, 60, 40),
                    new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide })
                );
                scene.add(sky);
            },
            undefined,
            function(err) {
                console.error("Vẫn gặp lỗi CORS. Đang dùng ảnh vũ trụ dự phòng...");
                loader.load('https://threejs.org/examples/textures/equirectangular/galaxy.jpg', (tex) => {
                    const sky = new THREE.Mesh(new THREE.SphereGeometry(800, 60, 40), new THREE.MeshBasicMaterial({map: tex, side: THREE.BackSide}));
                    scene.add(sky);
                });
            }
        );

        // --- 3. CÁC HÀNH TINH & CỘT DỮ LIỆU ---
        const planets = [];
        function createPlanet(r, x, y, z, color) {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(r, 32, 32),
                new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.5, emissive: color, emissiveIntensity: 0.1 })
            );
            mesh.position.set(x, y, z);
            scene.add(mesh);
            planets.push(mesh);
        }
        createPlanet(15, -100, 40, -150, 0x2244ff); 
        createPlanet(8, 80, 20, -100, 0xff6622);  
        createPlanet(5, -40, 60, -60, 0x88ff88);    

        // Bụi sao
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 4000; 
        const posArray = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i++) posArray[i] = (Math.random() - 0.5) * 300;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starField = new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.04, color: 0x00f2ff, transparent: true, opacity: 0.6 }));
        scene.add(starField);

        function addPillar(x, z, color, h) {
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, h, 16), new THREE.MeshBasicMaterial({ color: color, wireframe: true, transparent: true, opacity: 0.8 }));
            mesh.position.set(x, h/2, z);
            scene.add(mesh);
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.03, 16, 100), new THREE.MeshBasicMaterial({ color: color }));
            ring.rotation.x = Math.PI/2; ring.position.set(x, 0.05, z);
            scene.add(ring);
        }
        addPillar(-6, -6, 0x00f2ff, 7); 
        addPillar(6, -6, 0xff0055, 5);  
        addPillar(0, -15, 0xffff00, 10); 

        // --- 4. ĐIỀU KHIỂN ---
        let moveState = { f: 0, r: 0 };
        let look = { lat: 0, lon: -90 };
        let interact = false;
        let px, py, plon, plat;

        const joy = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: '#00f2ff' });
        joy.on('move', (e, d) => { moveState.f = d.vector.y; moveState.r = d.vector.x; });
        joy.on('end', () => { moveState = { f: 0, r: 0 }; });

        document.addEventListener('pointerdown', e => { if(e.clientX > 200) { interact = true; px = e.clientX; py = e.clientY; plon = look.lon; plat = look.lat; } });
        document.addEventListener('pointermove', e => { if (interact) { look.lon = (px - e.clientX) * 0.15 + plon; look.lat = (e.clientY - py) * 0.15 + plat; } });
        document.addEventListener('pointerup', () => interact = false);

        // --- 5. ANIMATION LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            look.lat = Math.max(-85, Math.min(85, look.lat));
            const phi = THREE.MathUtils.degToRad(90 - look.lat);
            const theta = THREE.MathUtils.degToRad(look.lon);
            const target = new THREE.Vector3().setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            if (moveState.f !== 0 || moveState.r !== 0) {
                const speed = 18 * dt;
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                camera.position.addScaledVector(dir, moveState.f * speed);
                camera.position.addScaledVector(side, -moveState.r * speed);
            }

            planets.forEach((p, i) => { p.rotation.y += 0.001 * (i + 1); });
            starField.rotation.y += 0.0002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
