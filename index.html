<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌌 Origin: Zero Void</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; z-index: 100; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="joystick-zone"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. VŨ TRỤ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205); 
        scene.fog = new THREE.Fog(0x020205, 30, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const floorBase = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({ visible: false }));
        floorBase.rotation.x = -Math.PI / 2; floorBase.position.y = -0.5;
        scene.add(floorBase);

        // --- 2. HỐ ĐEN & HẠT TỰ NHIÊN (FIXED) ---
        let portalCore, pSystem;
        function createEnergyPortal() {
            // Lõi đen
            portalCore = new THREE.Mesh(new THREE.CircleGeometry(1.5, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
            portalCore.rotation.x = -Math.PI / 2; portalCore.position.y = -0.4;
            scene.add(portalCore);

            // TẠO HẠT DẠNG ĐÁM MÂY (KHÔNG PHẢI HÌNH HỘP)
            const particlesGeo = new THREE.BufferGeometry();
            const pCount = 120; // Số lượng ít, thưa thớt
            const pPos = new Float32Array(pCount * 3);
            const pRnd = []; // Lưu giá trị ngẫu nhiên để hạt dao động riêng lẻ

            for(let i=0; i<pCount; i++) {
                // Thuật toán hình tròn: Giúp hạt tỏa ra đều, không bị vuông vức
                const radius = Math.random() * 2.5; // Bán kính phân tán tối đa 2.5m
                const angle = Math.random() * Math.PI * 2; // Góc ngẫu nhiên 360 độ

                // Tập trung nhiều ở tâm, ít ở xa (Hiệu ứng tụ khí)
                const distance = Math.pow(Math.random(), 2) * radius; 

                pPos[i*3] = Math.cos(angle) * distance; // X
                pPos[i*3+1] = Math.random() * 1.2;      // Y (Độ cao lơ lửng ngẫu nhiên)
                pPos[i*3+2] = Math.sin(angle) * distance; // Z

                pRnd.push(Math.random() * 100); // Pha dao động riêng
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            
            // Màu Xanh Neon
            const pMat = new THREE.PointsMaterial({ 
                color: 0x00f2ff, 
                size: 0.1, // Hạt nhỏ vừa phải
                transparent: true, 
                opacity: 0.7,
                blending: THREE.AdditiveBlending 
            });
            pSystem = new THREE.Points(particlesGeo, pMat);
            pSystem.position.y = -0.2; 
            pSystem.userData = { randoms: pRnd }; // Lưu dữ liệu dao động
            scene.add(pSystem);
        }
        createEnergyPortal();

        // --- 3. BỤI VŨ TRỤ ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 4000;
        const posArray = new Float32Array(starsCount * 3);
        const velocityArray = [];
        for(let i=0; i<starsCount; i++) {
            posArray[i*3] = (Math.random() - 0.5) * 80;
            posArray[i*3+1] = (Math.random() - 0.5) * 80;
            posArray[i*3+2] = (Math.random() - 0.5) * 80;
            velocityArray.push((Math.random() * 0.02) + 0.005);
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({ size: 0.05, color: 0x88ccff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // --- 4. CLICK ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        function onTouch(event) {
            let clientX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
            let clientY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.intersectObject(portalCore).length > 0) {
                document.body.style.transition = "transform 1s, opacity 1s";
                document.body.style.transform = "scale(3)";
                document.body.style.opacity = "0";
                setTimeout(() => { window.location.href = 'city.html'; }, 1000);
            }
        }
        window.addEventListener('click', onTouch);
        window.addEventListener('touchstart', onTouch);

        // --- 5. ANIMATION ---
        let moveState = { f: 0, r: 0 }, look = { lat: 0, lon: -90 }, interact = false, px, py, plon, plat;
        const joy = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'white' });
        joy.on('move', (e, d) => { moveState.f = d.vector.y; moveState.r = d.vector.x; });
        joy.on('end', () => { moveState = { f: 0, r: 0 }; });
        document.addEventListener('pointerdown', e => { if(e.clientX > 200) { interact = true; px = e.clientX; py = e.clientY; plon = look.lon; plat = look.lat; }});
        document.addEventListener('pointermove', e => { if (interact) { look.lon = (px - e.clientX) * 0.15 + plon; look.lat = (e.clientY - py) * 0.15 + plat; }});
        document.addEventListener('pointerup', () => interact = false);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const time = Date.now() * 0.001;

            // ANIMATION HẠT TỰ NHIÊN
            if(pSystem) {
                // 1. Xoay cực chậm (không quay chóng mặt)
                pSystem.rotation.y += 0.002;

                // 2. Dao động từng hạt (bồng bềnh)
                const positions = pSystem.geometry.attributes.position.array;
                const randoms = pSystem.userData.randoms;
                
                for(let i=0; i<120; i++) {
                    // Mỗi hạt nhấp nhô lên xuống độc lập
                    positions[i*3+1] += Math.sin(time + randoms[i]) * 0.003;
                }
                pSystem.geometry.attributes.position.needsUpdate = true;
            }

            look.lat = Math.max(-85, Math.min(85, look.lat));
            const phi = THREE.MathUtils.degToRad(90 - look.lat), theta = THREE.MathUtils.degToRad(look.lon);
            camera.lookAt(new THREE.Vector3().setFromSphericalCoords(1, phi, theta).add(camera.position));
            if (moveState.f !== 0 || moveState.r !== 0) {
                const speed = 8 * dt; 
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                const nextPos = camera.position.clone().addScaledVector(dir, moveState.f * speed).addScaledVector(side, -moveState.r * speed);
                if(nextPos.length() < 50) camera.position.copy(nextPos);
            }
            
            const pos = starField.geometry.attributes.position.array;
            for(let i=0; i < starsCount; i++) {
                pos[i*3 + 1] -= velocityArray[i]; 
                if (pos[i*3 + 1] < -40) pos[i*3 + 1] = 40;
            }
            starField.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
