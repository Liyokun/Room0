<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌆 Neon City - Proportions Optimized</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #joystick-zone {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px; z-index: 100; opacity: 0.8;
        }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            flex-direction: column; color: #00f2ff; font-family: 'Courier New', monospace;
            font-size: 18px; z-index: 999; transition: opacity 1s;
        }
        .spinner { border: 4px solid #00f2ff; border-top: 4px solid #ff0055;
            border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>🌆 ĐANG TỐI ƯU KHÔNG GIAN...</p>
        <p>Vui lòng đợi trong giây lát...</p>
    </div>

    <div id="joystick-zone"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. KHỞI TẠO ENGINE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000205);
        // Điều chỉnh sương mù để phù hợp với tỉ lệ mới
        scene.fog = new THREE.Fog(0x000205, 10, 250); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Tầm mắt người tiêu chuẩn
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. LOAD KHUNG CẢNH 360° (TỐI ƯU ĐỘ NÉT) ---
        const loader = new THREE.TextureLoader();
        loader.load('neoncity0.webp', (texture) => {
            const sky = new THREE.Mesh(
                // Thu nhỏ bán kính xuống 150 để ảnh sắc nét và gần mắt hơn
                new THREE.SphereGeometry(150, 64, 32), 
                new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide })
            );
            scene.add(sky);

            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 1000);
        });

        // --- 3. SÀN NHỎ GỌN (KHÔNG CHE TẦM NHÌN) ---
        const floorSize = 80; // Thu nhỏ sàn để nhìn thấy chân trời thành phố
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(floorSize, floorSize),
            // Thêm độ trong suốt nhẹ để sàn trông công nghệ hơn
            new THREE.MeshBasicMaterial({ color: 0x010103, transparent: true, opacity: 0.7 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5; // Hạ thấp sàn xuống dưới tầm mắt một chút
        scene.add(floor);

        const grid = new THREE.GridHelper(floorSize, 40, 0x00f2ff, 0x00f2ff);
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        grid.position.y = -0.49; // Đặt lưới ngay trên mặt sàn
        scene.add(grid);

        // --- 4. BỤI SAO + TRỤ NEON ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1500;
        const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 200;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starField = new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.08, color: 0xffffff, transparent: true, opacity: 0.6 }));
        scene.add(starField);

        function addPillar(x, z, color, h) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, h, 0.8), new THREE.MeshBasicMaterial({ color, wireframe: true }));
            mesh.position.set(x, h/2 - 0.5, z);
            scene.add(mesh);

            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.04, 16, 100), new THREE.MeshBasicMaterial({ color }));
            ring.rotation.x = Math.PI/2;
            ring.position.set(x, -0.4, z);
            scene.add(ring);
        }
        // Đặt các trụ gần hơn để dễ quan sát
        addPillar(-10, -10, 0x00f2ff, 8); // Skincare
        addPillar(10, -10, 0xff0055, 6);  // Health
        addPillar(0, -20, 0xffff00, 10); // Total

        // --- 5. ĐIỀU KHIỂN ---
        let moveState = { f: 0, r: 0 };
        let look = { lat: 0, lon: -90 };
        let interact = false;
        let px, py, plon, plat;

        const joy = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'cyan' });
        joy.on('move', (e, d) => { moveState.f = d.vector.y; moveState.r = d.vector.x; });
        joy.on('end', () => { moveState = { f: 0, r: 0 }; });

        document.addEventListener('pointerdown', e => { if(e.clientX > 200) { interact = true; px = e.clientX; py = e.clientY; plon = look.lon; plat = look.lat; }});
        document.addEventListener('pointermove', e => { if (interact) { look.lon = (px - e.clientX) * 0.15 + plon; look.lat = (e.clientY - py) * 0.15 + plat; }});
        document.addEventListener('pointerup', () => interact = false);

        // --- 6. VÒNG LẶP ANIMATION ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            look.lat = Math.max(-85, Math.min(85, look.lat));
            const phi = THREE.MathUtils.degToRad(90 - look.lat);
            const theta = THREE.MathUtils.degToRad(look.lon);
            const target = new THREE.Vector3().setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            if (moveState.f !== 0 || moveState.r !== 0) {
                const speed = 12 * dt; 
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                camera.position.addScaledVector(dir, moveState.f * speed);
                camera.position.addScaledVector(side, -moveState.r * speed);
            }

            // Giới hạn vùng di chuyển trong phạm vi sàn
            const lim = (floorSize / 2) - 2;
            camera.position.x = Math.max(-lim, Math.min(lim, camera.position.x));
            camera.position.z = Math.max(-lim, Math.min(lim, camera.position.z));

            starField.rotation.y += 0.0002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
