<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌌 Origin: Zero Void</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; z-index: 100; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="joystick-zone"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. VŨ TRỤ VÔ TẬN ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205); 
        scene.fog = new THREE.Fog(0x020205, 5, 40);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Sàn vô hình (Để đi lại)
        const floorBase = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({ visible: false }));
        floorBase.rotation.x = -Math.PI / 2; floorBase.position.y = -0.5;
        scene.add(floorBase);

        // --- 2. HỐ ĐEN KỸ THUẬT SỐ (CỔNG SANG CITY) ---
        let portalCore, particlesSystem;
        function createEnergyPortal() {
            // Lõi đen tuyệt đối
            portalCore = new THREE.Mesh(
                new THREE.CircleGeometry(2, 32),
                new THREE.MeshBasicMaterial({ color: 0x000000 })
            );
            portalCore.rotation.x = -Math.PI / 2;
            portalCore.position.y = -0.4;
            scene.add(portalCore);

            // HỆ THỐNG HẠT NĂNG LƯỢNG (Bay từ trong ra)
            // Màu SÁNG (Cyan/White) đại diện cho thành phố ánh sáng bên kia
            const pCount = 300;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(pCount * 3);
            const pVel = []; // Vận tốc bay ra

            for(let i=0; i<pCount; i++) {
                pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0; // Xuất phát từ tâm
                
                // Hướng bay ngẫu nhiên tỏa ra xung quanh
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 0.05 + 0.01;
                pVel.push({
                    x: Math.cos(angle) * speed,
                    y: (Math.random() - 0.5) * 0.02 + 0.05, // Bay hơi cao lên chút
                    z: Math.sin(angle) * speed
                });
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            
            const pMat = new THREE.PointsMaterial({
                color: 0x00f2ff, // Màu sáng Cyan
                size: 0.08,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particlesSystem = new THREE.Points(pGeo, pMat);
            particlesSystem.position.set(0, -0.3, 0); // Đặt ngay trên mặt hố đen
            particlesSystem.userData = { velocities: pVel }; // Lưu vận tốc vào object
            scene.add(particlesSystem);
        }
        createEnergyPortal();

        // --- 3. BÃO BỤI SỐ (MÔI TRƯỜNG) ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 4000;
        const posArray = new Float32Array(starsCount * 3);
        const velocityArray = [];
        for(let i=0; i<starsCount; i++) {
            posArray[i*3] = (Math.random() - 0.5) * 60;
            posArray[i*3+1] = (Math.random() - 0.5) * 60;
            posArray[i*3+2] = (Math.random() - 0.5) * 60;
            velocityArray.push((Math.random() * 0.02) + 0.005);
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({ size: 0.05, color: 0x88ccff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // --- 4. TƯƠNG TÁC BÍ ẨN (CLICK ĐỂ ĐI) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onTouch(event) {
            let clientX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
            let clientY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            if (raycaster.intersectObject(portalCore).length > 0) {
                // Hiệu ứng hút vào
                document.body.style.transition = "transform 1s, opacity 1s";
                document.body.style.transform = "scale(2)"; // Phóng to màn hình tạo cảm giác bị hút
                document.body.style.opacity = "0";
                setTimeout(() => {
                    window.location.href = 'city.html'; // CHUYỂN SANG THÀNH PHỐ
                }, 1000);
            }
        }
        window.addEventListener('click', onTouch);
        window.addEventListener('touchstart', onTouch);

        // --- 5. LOGIC ANIMATION ---
        let moveState = { f: 0, r: 0 }, look = { lat: 0, lon: -90 }, interact = false, px, py, plon, plat;
        const joy = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'white' });
        joy.on('move', (e, d) => { moveState.f = d.vector.y; moveState.r = d.vector.x; });
        joy.on('end', () => { moveState = { f: 0, r: 0 }; });
        document.addEventListener('pointerdown', e => { if(e.clientX > 200) { interact = true; px = e.clientX; py = e.clientY; plon = look.lon; plat = look.lat; }});
        document.addEventListener('pointermove', e => { if (interact) { look.lon = (px - e.clientX) * 0.15 + plon; look.lat = (e.clientY - py) * 0.15 + plat; }});
        document.addEventListener('pointerup', () => interact = false);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // CAMERA
            look.lat = Math.max(-85, Math.min(85, look.lat));
            const phi = THREE.MathUtils.degToRad(90 - look.lat), theta = THREE.MathUtils.degToRad(look.lon);
            camera.lookAt(new THREE.Vector3().setFromSphericalCoords(1, phi, theta).add(camera.position));
            if (moveState.f !== 0 || moveState.r !== 0) {
                const speed = 8 * dt; 
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                const nextPos = camera.position.clone().addScaledVector(dir, moveState.f * speed).addScaledVector(side, -moveState.r * speed);
                if(nextPos.length() < 40) camera.position.copy(nextPos);
            }
            
            // ANIMATION HẠT CỔNG (Bay từ trong ra)
            const pPos = particlesSystem.geometry.attributes.position.array;
            const pVel = particlesSystem.userData.velocities;
            for(let i=0; i < pVel.length; i++) {
                pPos[i*3] += pVel[i].x;
                pPos[i*3+1] += pVel[i].y;
                pPos[i*3+2] += pVel[i].z;

                // Nếu bay xa quá thì reset về tâm hố đen (Tạo vòng lặp vô tận)
                const dist = Math.sqrt(pPos[i*3]**2 + pPos[i*3+2]**2);
                if(dist > 3 || pPos[i*3+1] > 2) {
                    pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0;
                }
            }
            particlesSystem.geometry.attributes.position.needsUpdate = true;

            // ANIMATION BỤI VŨ TRỤ
            const pos = starField.geometry.attributes.position.array;
            for(let i=0; i < starsCount; i++) {
                pos[i*3 + 1] -= velocityArray[i]; 
                if (pos[i*3 + 1] < -30) pos[i*3 + 1] = 30;
            }
            starField.geometry.attributes.position.needsUpdate = true;
            starField.rotation.y += 0.0005;

            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
