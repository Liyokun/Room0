<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌆 Neon Penthouse - Final</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #joystick-zone {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px; z-index: 100; opacity: 0.8;
        }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            flex-direction: column; color: #00f2ff; font-family: 'Courier New', monospace;
            font-size: 18px; z-index: 999; transition: opacity 1s;
        }
        .spinner { border: 4px solid #00f2ff; border-top: 4px solid #ff0055;
            border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>🌆 ĐANG XÂY DỰNG BAN CÔNG...</p>
        <p>Vui lòng đợi...</p>
    </div>

    <div id="joystick-zone"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. KHỞI TẠO ENGINE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000205);
        scene.fog = new THREE.Fog(0x000205, 10, 250); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5); // Đứng ở giữa ban công

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. LOAD ẢNH 360 (SẮC NÉT) ---
        const loader = new THREE.TextureLoader();
        loader.load('neoncity0.webp', (texture) => {
            const sky = new THREE.Mesh(
                // Bán kính 120: Đủ gần để nét, đủ xa để thoáng
                new THREE.SphereGeometry(120, 64, 32), 
                new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide })
            );
            scene.add(sky);

            // Ẩn loading
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 1000);
        });

        // --- 3. BAN CÔNG PENTHOUSE (THAY CHO SÀN VUÔNG ĐEN) ---
        
        // A. Sàn kính tròn (Circle)
        const balconyRadius = 40; 
        const floor = new THREE.Mesh(
            new THREE.CircleGeometry(balconyRadius, 64),
            new THREE.MeshBasicMaterial({ color: 0x050510, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.1; 
        scene.add(floor);

        // B. Lưới trang trí trên sàn
        const gridHelper = new THREE.PolarGridHelper(balconyRadius, 16, 8, 64, 0x00f2ff, 0x00f2ff);
        gridHelper.position.y = -0.09;
        gridHelper.material.opacity = 0.3;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // C. Lan can phát sáng (Railing) - Điểm nhấn quan trọng!
        const railGeo = new THREE.TorusGeometry(balconyRadius, 0.5, 16, 100);
        const railMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff });
        const railing = new THREE.Mesh(railGeo, railMat);
        railing.rotation.x = Math.PI / 2;
        railing.position.y = 1.0; // Cao ngang bụng
        scene.add(railing);

        // --- 4. CỘT DỮ LIỆU & BỤI SAO ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1000;
        const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 200;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starField = new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.08, color: 0xffffff, transparent: true, opacity: 0.5 }));
        scene.add(starField);

        function addPillar(x, z, color, h) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, h, 1), new THREE.MeshBasicMaterial({ color, wireframe: true }));
            mesh.position.set(x, h/2 - 0.1, z);
            scene.add(mesh);
            // Vòng sáng dưới chân cột
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.05, 16, 100), new THREE.MeshBasicMaterial({ color }));
            ring.rotation.x = Math.PI/2;
            ring.position.set(x, 0, z);
            scene.add(ring);
        }
        
        // Đặt cột nằm gọn trong ban công
        addPillar(-10, -10, 0x00f2ff, 8); // Skincare
        addPillar(10, -10, 0xff0055, 6);  // Health
        addPillar(0, -20, 0xffff00, 10); // Total

        // --- 5. ĐIỀU KHIỂN ---
        let moveState = { f: 0, r: 0 };
        let look = { lat: 0, lon: -90 };
        let interact = false;
        let px, py, plon, plat;

        const joy = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'cyan' });
        joy.on('move', (e, d) => { moveState.f = d.vector.y; moveState.r = d.vector.x; });
        joy.on('end', () => { moveState = { f: 0, r: 0 }; });

        document.addEventListener('pointerdown', e => { if(e.clientX > 200) { interact = true; px = e.clientX; py = e.clientY; plon = look.lon; plat = look.lat; }});
        document.addEventListener('pointermove', e => { if (interact) { look.lon = (px - e.clientX) * 0.15 + plon; look.lat = (e.clientY - py) * 0.15 + plat; }});
        document.addEventListener('pointerup', () => interact = false);

        // --- 6. ANIMATION ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            look.lat = Math.max(-85, Math.min(85, look.lat));
            const phi = THREE.MathUtils.degToRad(90 - look.lat);
            const theta = THREE.MathUtils.degToRad(look.lon);
            const target = new THREE.Vector3().setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            if (moveState.f !== 0 || moveState.r !== 0) {
                const speed = 10 * dt; 
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                
                // Tính toán vị trí dự kiến
                const nextPos = camera.position.clone();
                nextPos.addScaledVector(dir, moveState.f * speed);
                nextPos.addScaledVector(side, -moveState.r * speed);

                // Giới hạn hình tròn (Bán kính ban công - 2m an toàn)
                if (nextPos.length() < balconyRadius - 2) {
                    camera.position.copy(nextPos);
                }
            }

            starField.rotation.y += 0.0002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
