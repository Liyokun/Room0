<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌆 Neon City FPS Explorer - Clear Vibes</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #joystick-zone {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px; z-index: 100; opacity: 0.8;
        }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            flex-direction: column; color: #00f2ff; font-family: 'Courier New', monospace;
            font-size: 18px; z-index: 999; transition: opacity 1s;
        }
        .spinner { border: 4px solid #00f2ff; border-top: 4px solid #ff0055;
            border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>🌆 ĐANG KHỞI ĐỘNG NEON CITY...</p>
        <p>Đang load khung cảnh rõ nét...</p>
    </div>

    <div id="joystick-zone"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';

        // --- KHỞI TẠO ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Nền đen sạch
        // BỎ FOG HOÀN TOÀN ĐỂ RÕ NÉT (nếu muốn fog nhẹ sau này thì thêm lại)
        // scene.fog = null;

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- LOAD KHUNG CẢNH 360° LỚN HƠN, RÕ HƠN ---
        const loader = new THREE.TextureLoader();
        loader.load('neoncity0.webp', (texture) => {
            const sky = new THREE.Mesh(
                new THREE.SphereGeometry(1500, 60, 40), // LỚN HƠN ĐỂ BAO RỘNG
                new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide })
            );
            scene.add(sky);

            // Ẩn loading
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 1000);
        }, undefined, (err) => {
            console.error('Lỗi load:', err);
        });

        // --- SÀN RỘNG NHƯNG DỄ ĐỊNH HƯỚNG ---
        const floorSize = 600; // Vẫn rộng để khám phá
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(floorSize, floorSize),
            new THREE.MeshBasicMaterial({ color: 0x010103 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        scene.add(floor);

        const grid = new THREE.GridHelper(floorSize, 60, 0x00f2ff, 0x00f2ff); // Nhiều ô hơn để thấy rõ
        grid.material.opacity = 0.3;
        grid.material.transparent = true;
        scene.add(grid);

        // --- BỤI SAO + TRỤ (giữ để vui mắt) ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 3000;
        const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 600;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starField = new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.05, color: 0xffffff, transparent: true, opacity: 0.7 }));
        scene.add(starField);

        function addPillar(x, z, color, h) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, h, 1.2), new THREE.MeshBasicMaterial({ color, wireframe: true }));
            mesh.position.set(x, h/2, z);
            scene.add(mesh);
        }
        addPillar(-30, -30, 0x00f2ff, 15);
        addPillar(30, -30, 0xff0055, 12);
        addPillar(0, -60, 0xffff00, 20);

        // --- ĐIỀU KHIỂN ---
        let moveState = { f: 0, r: 0 };
        let look = { lat: 0, lon: -90 };
        let interact = false;
        let px, py, plon, plat;

        const joy = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'cyan' });
        joy.on('move', (e, d) => { moveState.f = d.vector.y; moveState.r = d.vector.x; });
        joy.on('end', () => { moveState = { f: 0, r: 0 }; });

        document.addEventListener('pointerdown', e => { if(e.clientX > 200) { interact = true; px = e.clientX; py = e.clientY; plon = look.lon; plat = look.lat; }});
        document.addEventListener('pointermove', e => { if (interact) { look.lon = (px - e.clientX) * 0.15 + plon; look.lat = (e.clientY - py) * 0.15 + plat; }});
        document.addEventListener('pointerup', () => interact = false);

        // --- VÒNG LẶP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            look.lat = Math.max(-85, Math.min(85, look.lat));
            const phi = THREE.MathUtils.degToRad(90 - look.lat);
            const theta = THREE.MathUtils.degToRad(look.lon);
            const target = new THREE.Vector3().setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            if (moveState.f !== 0 || moveState.r !== 0) {
                const speed = 20 * dt; // Nhanh hơn cho không gian rộng
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                camera.position.addScaledVector(dir, moveState.f * speed);
                camera.position.addScaledVector(side, -moveState.r * speed);
            }

            // Giới hạn rộng rãi hơn
            const lim = 300;
            camera.position.x = Math.max(-lim, Math.min(lim, camera.position.x));
            camera.position.z = Math.max(-lim, Math.min(lim, camera.position.z));

            starField.rotation.y += 0.0003;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
