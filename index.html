<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌌 Origin: Zero Void</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; z-index: 100; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="joystick-zone"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. VŨ TRỤ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205); 
        scene.fog = new THREE.Fog(0x020205, 30, 100); // Sương mù xa

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Sàn vô hình
        const floorBase = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({ visible: false }));
        floorBase.rotation.x = -Math.PI / 2; floorBase.position.y = -0.5;
        scene.add(floorBase);

        // --- 2. HỐ ĐEN & HẠT LƠ LỬNG (FLOATING PARTICLES) ---
        let portalCore, particlesSystem;
        function createEnergyPortal() {
            portalCore = new THREE.Mesh(new THREE.CircleGeometry(2, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
            portalCore.rotation.x = -Math.PI / 2; portalCore.position.y = -0.4;
            scene.add(portalCore);

            // LOGIC MỚI: ĐÁM MÂY HẠT (CLOUD)
            const pCount = 300;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(pCount * 3);
            const pRnd = []; // Lưu giá trị ngẫu nhiên để mỗi hạt dao động khác nhau

            for(let i=0; i<pCount; i++) {
                // Tạo hạt trong khối cầu bán kính 1.5m quanh hố đen
                const r = Math.random() * 1.5;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                
                pPos[i*3] = r * Math.sin(phi) * Math.cos(theta); // X
                pPos[i*3+1] = Math.abs(r * Math.cos(phi)) * 0.5; // Y (Chỉ dương, thấp)
                pPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta); // Z
                
                pRnd.push(Math.random() * 100); // Pha dao động ngẫu nhiên
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            
            const pMat = new THREE.PointsMaterial({
                color: 0x00f2ff, // Xanh Sáng
                size: 0.15,      // Hạt to, mềm
                transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending
            });

            particlesSystem = new THREE.Points(pGeo, pMat);
            particlesSystem.position.set(0, -0.3, 0); 
            particlesSystem.userData = { randoms: pRnd }; // Lưu dữ liệu
            scene.add(particlesSystem);
        }
        createEnergyPortal();

        // --- 3. BÃO BỤI VŨ TRỤ ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 4000;
        const posArray = new Float32Array(starsCount * 3);
        const velocityArray = [];
        for(let i=0; i<starsCount; i++) {
            posArray[i*3] = (Math.random() - 0.5) * 80;
            posArray[i*3+1] = (Math.random() - 0.5) * 80;
            posArray[i*3+2] = (Math.random() - 0.5) * 80;
            velocityArray.push((Math.random() * 0.02) + 0.005);
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({ size: 0.05, color: 0x88ccff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // --- 4. TƯƠNG TÁC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        function onTouch(event) {
            let clientX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
            let clientY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.intersectObject(portalCore).length > 0) {
                document.body.style.transition = "transform 1s, opacity 1s";
                document.body.style.transform = "scale(3)";
                document.body.style.opacity = "0";
                setTimeout(() => { window.location.href = 'city.html'; }, 1000);
            }
        }
        window.addEventListener('click', onTouch);
        window.addEventListener('touchstart', onTouch);

        // --- 5. ANIMATION ---
        let moveState = { f: 0, r: 0 }, look = { lat: 0, lon: -90 }, interact = false, px, py, plon, plat;
        const joy = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'white' });
        joy.on('move', (e, d) => { moveState.f = d.vector.y; moveState.r = d.vector.x; });
        joy.on('end', () => { moveState = { f: 0, r: 0 }; });
        document.addEventListener('pointerdown', e => { if(e.clientX > 200) { interact = true; px = e.clientX; py = e.clientY; plon = look.lon; plat = look.lat; }});
        document.addEventListener('pointermove', e => { if (interact) { look.lon = (px - e.clientX) * 0.15 + plon; look.lat = (e.clientY - py) * 0.15 + plat; }});
        document.addEventListener('pointerup', () => interact = false);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const time = Date.now() * 0.001; // Lấy thời gian thực

            // Camera logic
            look.lat = Math.max(-85, Math.min(85, look.lat));
            const phi = THREE.MathUtils.degToRad(90 - look.lat), theta = THREE.MathUtils.degToRad(look.lon);
            camera.lookAt(new THREE.Vector3().setFromSphericalCoords(1, phi, theta).add(camera.position));
            if (moveState.f !== 0 || moveState.r !== 0) {
                const speed = 8 * dt; 
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                const nextPos = camera.position.clone().addScaledVector(dir, moveState.f * speed).addScaledVector(side, -moveState.r * speed);
                if(nextPos.length() < 50) camera.position.copy(nextPos);
            }
            
            // --- ANIMATION HẠT LƠ LỬNG (SIN WAVE) ---
            const pPos = particlesSystem.geometry.attributes.position.array;
            const pRnd = particlesSystem.userData.randoms;
            
            // Xoay cả cụm hạt từ từ
            particlesSystem.rotation.y += 0.01;

            for(let i=0; i < pRnd.length; i++) {
                // Công thức sóng Sin: Dao động lên xuống tại chỗ
                // Y = Y_gốc + Sin(thời gian + độ_lệch_pha) * biên_độ
                pPos[i*3+1] = Math.abs(Math.sin(time * 1 + pRnd[i])) * 0.5 + 0.1;
            }
            particlesSystem.geometry.attributes.position.needsUpdate = true;

            // Bụi vũ trụ
            const pos = starField.geometry.attributes.position.array;
            for(let i=0; i < starsCount; i++) {
                pos[i*3 + 1] -= velocityArray[i]; 
                if (pos[i*3 + 1] < -40) pos[i*3 + 1] = 40;
            }
            starField.geometry.attributes.position.needsUpdate = true;
            starField.rotation.y += 0.0005;

            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
