<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon City v4.9 - GitHub Stable</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; z-index: 100; }
        #status { position: absolute; top: 10px; width: 100%; text-align: center; color: #0ff; font-family: monospace; pointer-events: none; z-index: 200; }
    </style>
</head>
<body>
    <div id="status">Đang khởi tạo hệ thống...</div>
    <div id="joystick-zone"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://yoannimmo.github.io/nipplejs/dist/nipplejs.js"></script>

    <script>
        var scene, camera, renderer, joy;
        var moveState = { f: 0, r: 0 };
        var look = { lat: 0, lon: -90 };
        var isMoving = false;

        function init() {
            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x020205);
                
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
                camera.position.set(0, 3, 10);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                // Ánh sáng cường độ cao để đảm bảo thấy vật thể
                scene.add(new THREE.AmbientLight(0xffffff, 1));

                // 1. Tải ảnh bầu trời (Dùng link GitHub trực tiếp của bạn)
                var loader = new THREE.TextureLoader();
                loader.setCrossOrigin('anonymous');
                loader.load('https://liyokun.github.io/Room0/neoncity0.webp', function(texture) {
                    var sky = new THREE.Mesh(
                        new THREE.SphereGeometry(1000, 60, 40),
                        new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide })
                    );
                    scene.add(sky);
                    document.getElementById('status').innerText = "Hệ thống: Neo Tokyo ONLINE";
                    setTimeout(function(){ document.getElementById('status').style.display='none'; }, 3000);
                }, undefined, function(e) {
                    document.getElementById('status').innerText = "Cảnh báo: Lỗi nạp Texture, đang dùng chế độ dự phòng.";
                });

                // 2. Các vật thể Neon (Để chắc chắn bạn thấy gì đó khi di chuyển)
                var cubeGeo = new THREE.BoxGeometry(2, 10, 2);
                var cubeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
                for(var i=0; i<10; i++) {
                    var c = new THREE.Mesh(cubeGeo, cubeMat);
                    c.position.set(Math.random()*100-50, 5, Math.random()*100-50);
                    scene.add(c);
                }

                // 3. Cài đặt Joystick
                joy = nipplejs.create({
                    zone: document.getElementById('joystick-zone'),
                    mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'cyan'
                });
                joy.on('move', function(e, d) {
                    moveState.f = d.vector.y;
                    moveState.r = d.vector.x;
                });
                joy.on('end', function() { moveState = { f: 0, r: 0 }; });

                // 4. Xoay màn hình (Chuột/Cảm ứng)
                var px, py, plon, plat, interact = false;
                document.addEventListener('mousedown', function(e) { interact = true; px = e.clientX; py = e.clientY; plon = look.lon; plat = look.lat; });
                document.addEventListener('mousemove', function(e) {
                    if(interact) {
                        look.lon = (px - e.clientX) * 0.2 + plon;
                        look.lat = (e.clientY - py) * 0.2 + plat;
                    }
                });
                document.addEventListener('mouseup', function() { interact = false; });
                
                // Hỗ trợ cảm ứng điện thoại
                document.addEventListener('touchstart', function(e) { interact = true; px = e.touches[0].clientX; py = e.touches[0].clientY; plon = look.lon; plat = look.lat; });
                document.addEventListener('touchmove', function(e) {
                    if(interact) {
                        look.lon = (px - e.touches[0].clientX) * 0.2 + plon;
                        look.lat = (e.touches[0].clientY - py) * 0.2 + plat;
                    }
                });
                document.addEventListener('touchend', function() { interact = false; });

                animate();
            } catch(err) {
                document.getElementById('status').innerText = "Lỗi khởi tạo: " + err.message;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            look.lat = Math.max(-85, Math.min(85, look.lat));
            var phi = THREE.MathUtils.degToRad(90 - look.lat);
            var theta = THREE.MathUtils.degToRad(look.lon);
            var target = new THREE.Vector3().setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            if(moveState.f !== 0 || moveState.r !== 0) {
                var dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0; dir.normalize();
                var side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                camera.position.addScaledVector(dir, moveState.f * 0.5);
                camera.position.addScaledVector(side, -moveState.r * 0.5);
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
        window.onresize = function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
