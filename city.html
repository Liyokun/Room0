<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌆 Neon City - Rain & Void</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; z-index: 100; opacity: 0.8; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; transition: opacity 1s; }
    </style>
</head>
<body>
    <div id="loading"></div>
    <div id="joystick-zone"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. SETUP SCENE CHÍNH (3D) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000205);
        scene.fog = null; // Không sương mù

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // QUAN TRỌNG: Tắt tự động xóa để vẽ chồng 2 scene lên nhau
        renderer.autoClear = false; 
        document.body.appendChild(renderer.domElement);

        // --- 2. SETUP SCENE HUD (MÀN HÌNH 2D ĐỂ VẼ MƯA) ---
        // Scene này sẽ luôn nằm trên cùng, không bị phông nền 3D che khuất
        const sceneHUD = new THREE.Scene();
        // Camera trực giao (2D flat) cho HUD
        const cameraHUD = new THREE.OrthographicCamera(-window.innerWidth / 2, window.innerWidth / 2, window.innerHeight / 2, -window.innerHeight / 2, 1, 10);
        cameraHUD.position.z = 10;

        // --- 3. MÔI TRƯỜNG 3D ---
        const loader = new THREE.TextureLoader();
        loader.load('neoncity0.webp', (texture) => {
            const sky = new THREE.Mesh(
                new THREE.SphereGeometry(100, 64, 32), 
                new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide })
            );
            scene.add(sky);
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 1000);
        });

        const floor = new THREE.Mesh(new THREE.CircleGeometry(8, 32), new THREE.MeshBasicMaterial({ color: 0x050510, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
        floor.rotation.x = -Math.PI / 2; floor.position.y = -0.1; scene.add(floor);
        const gridHelper = new THREE.PolarGridHelper(8, 8, 5, 32, 0x00f2ff, 0x00f2ff);
        gridHelper.position.y = -0.09; gridHelper.material.opacity = 0.3; gridHelper.material.transparent = true; scene.add(gridHelper);
        const rail = new THREE.Mesh(new THREE.TorusGeometry(8, 0.2, 16, 100), new THREE.MeshBasicMaterial({ color: 0x00f2ff }));
        rail.rotation.x = Math.PI / 2; rail.position.y = 1.0; scene.add(rail);

        // --- 4. TẠO MƯA TRÊN LỚP HUD (GIẢI PHÁP CHO PHÔNG NỀN) ---
        const rainCount = 2000;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        for(let i=0; i<rainCount; i++) {
            // Rải mưa trên toàn bộ diện tích màn hình 2D
            rainPos[i*3] = (Math.random() - 0.5) * width; 
            rainPos[i*3+1] = (Math.random() - 0.5) * height;
            rainPos[i*3+2] = 0; // Z = 0 vì là màn hình phẳng
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainMat = new THREE.PointsMaterial({
            color: 0xaaaaaa,
            size: 3, // Kích thước hạt trên màn hình 2D (pixel)
            transparent: true,
            opacity: 0.6,
            sizeAttenuation: false // Kích thước không đổi theo khoảng cách
        });
        const rainSystem = new THREE.Points(rainGeo, rainMat);
        // THÊM MƯA VÀO SCENE HUD, KHÔNG PHẢI SCENE 3D CHÍNH
        sceneHUD.add(rainSystem);

        // --- 5. HỐ ĐEN & HẠT ĐỎ (ĐÃ XÓA VÒNG XOAY) ---
        let portalCore, pSystem;
        function createVoidPortal() {
            // Lõi đen
            portalCore = new THREE.Mesh(new THREE.CircleGeometry(1.5, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
            portalCore.rotation.x = -Math.PI / 2; portalCore.position.y = -0.05; 
            scene.add(portalCore);

            // --- ĐÃ XÓA ĐOẠN CODE TẠO VÒNG RING Ở ĐÂY ---

            // HẠT TĨNH (Cụm mây hạt đỏ/hồng)
            const particlesGeo = new THREE.BufferGeometry();
            const pCount = 300;
            const pArr = new Float32Array(pCount * 3);
            for(let i=0; i<pCount*3; i++) {
                pArr[i] = (Math.random() - 0.5) * 4; 
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
            
            const pMat = new THREE.PointsMaterial({ color: 0xff0055, size: 0.08, transparent: true, opacity: 0.8 });
            pSystem = new THREE.Points(particlesGeo, pMat);
            pSystem.position.y = 0.2; 
            scene.add(pSystem);
        }
        createVoidPortal();

        // --- 6. CLICK ĐỂ VỀ INDEX ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        function onTouch(event) {
            let clientX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
            let clientY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.intersectObject(portalCore).length > 0) {
                document.body.style.transition = "transform 1s, opacity 1s";
                document.body.style.transform = "scale(0.1)"; 
                document.body.style.opacity = "0";
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }
        }
        window.addEventListener('click', onTouch);
        window.addEventListener('touchstart', onTouch);

        // --- 7. ANIMATION ---
        let moveState = { f: 0, r: 0 }, look = { lat: 0, lon: -90 }, interact = false, px, py, plon, plat;
        const joy = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left: '60px', bottom: '60px'}, color: 'cyan' });
        joy.on('move', (e, d) => { moveState.f = d.vector.y; moveState.r = d.vector.x; });
        joy.on('end', () => { moveState = { f: 0, r: 0 }; });
        document.addEventListener('pointerdown', e => { if(e.clientX > 200) { interact = true; px = e.clientX; py = e.clientY; plon = look.lon; plat = look.lat; }});
        document.addEventListener('pointermove', e => { if (interact) { look.lon = (px - e.clientX) * 0.15 + plon; look.lat = (e.clientY - py) * 0.15 + plat; }});
        document.addEventListener('pointerup', () => interact = false);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // --- ĐÃ XÓA HOẠT ẢNH XOAY VÒNG RING ---
            
            // Xoay nhẹ cụm hạt đỏ
            if(pSystem) pSystem.rotation.y += 0.005; 

            // ANIMATION MƯA TRÊN HUD (Rơi xuống trên màn hình 2D)
            const rPos = rainSystem.geometry.attributes.position.array;
            const height = window.innerHeight;
            for(let i=0; i<rainCount; i++) {
                rPos[i*3+1] -= 5; // Tốc độ rơi pixel/frame
                if(rPos[i*3+1] < -height/2) { // Nếu rơi khỏi đáy màn hình
                    rPos[i*3+1] = height/2; // Đưa lên đỉnh màn hình
                }
            }
            rainSystem.geometry.attributes.position.needsUpdate = true;

            // Camera
            look.lat = Math.max(-85, Math.min(85, look.lat));
            const phi = THREE.MathUtils.degToRad(90 - look.lat), theta = THREE.MathUtils.degToRad(look.lon);
            camera.lookAt(new THREE.Vector3().setFromSphericalCoords(1, phi, theta).add(camera.position));
            if (moveState.f !== 0 || moveState.r !== 0) {
                const speed = 8 * dt; 
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                const nextPos = camera.position.clone().addScaledVector(dir, moveState.f * speed).addScaledVector(side, -moveState.r * speed);
                if (nextPos.length() < 7) camera.position.copy(nextPos);
            }

            // RENDER KÉP QUAN TRỌNG:
            // 1. Xóa màn hình
            renderer.clear();
            // 2. Vẽ cảnh 3D (Thành phố, sàn...)
            renderer.render(scene, camera);
            // 3. Xóa bộ đệm độ sâu (để lớp sau vẽ đè lên lớp trước bất kể khoảng cách)
            renderer.clearDepth();
            // 4. Vẽ cảnh HUD (Mưa) lên trên cùng
            renderer.render(sceneHUD, cameraHUD);
        }
        animate();
        
        // Cập nhật kích thước HUD khi resize màn hình
        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            
            cameraHUD.left = -window.innerWidth / 2;
            cameraHUD.right = window.innerWidth / 2;
            cameraHUD.top = window.innerHeight / 2;
            cameraHUD.bottom = -window.innerHeight / 2;
            cameraHUD.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight); 
        });
    </script>
</body>
</html>
